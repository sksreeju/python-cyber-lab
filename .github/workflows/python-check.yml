name: python-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install flake8 bandit

           - name: Run all Python files
        run: |
          for file in $(find . -name "*.py" -not -path "./.venv/*" -not -path "./.git/*"); do
            echo "Running $file"
            python "$file"
          done

      - name: Lint with flake8
        run: flake8 . --max-line-length=100 --exclude=.venv,.git

      - name: Security scan with bandit
        run: bandit -r . -x ./.venv